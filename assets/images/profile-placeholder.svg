<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 300 300" width="300" height="300" role="img" aria-label="Profile photo placeholder">

    <defs>
        <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
            <stop offset="0%" stop-color="#1b2236"/>
            <stop offset="100%" stop-color="#151b2b"/>
        </linearGradient>
    </defs>

    <rect width="300" height="300" fill="url(#bg)"/>

    <!-- head -->
    <circle cx="150" cy="118" r="46" fill="#6c63ff" opacity="0.85"/>

    <!-- shoulders -->
